# Publication de MALSSI sur GitHub Pages.
# Remplace la publication « depuis une branche », dont l'étape de déploiement était restée bloquée.
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Contrôle du contenu
        run: node tools/check.mjs
      - name: Préparer le site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js data icons vendor _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Un ancien déploiement « depuis une branche » est resté bloqué côté GitHub et empêche tout nouveau déploiement :
      # on l'annule s'il est encore en cours (sans effet sinon).
      - name: Annuler un déploiement bloqué
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/deployments/cc14189aa36839d331af95d8a333d7a6bd932351/cancel" && echo "annulation demandée" || echo "rien à annuler"
          sleep 60
      - id: deployment
        uses: actions/deploy-pages@v4
